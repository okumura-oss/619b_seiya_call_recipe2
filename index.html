#home .sb{color:#fff}.bat.h:after{background:#fff;opacity:.5}.bat.h{background:linear-gradient(90deg,rgba(255,255,255,.92) 32%,rgba(255,255,255,.35) 32%);color:#000}
.grid{position:absolute;top:75px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px}
.app{text-align:center;font-size:10.5px;position:relative}
.ic{width:62px;height:62px;border-radius:15px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;color:#000}
.bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;line-height:22px;font-weight:600;padding:0 5px}
.srch{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.3);border-radius:14px;padding:5px 14px;font-size:11px}

#hist{background:#fff;color:#000}.bat.k{background:linear-gradient(90deg,#9a9aa0 32%,#dcdcdf 32%);color:#000}
.hd{position:absolute;top:56px;left:24px;font-weight:700;font-size:18px}
.rows{position:absolute;top:97px;left:0;right:0}
.row{height:67px;font-weight:500;font-size:15px;display:flex;align-items:center;padding:0 22px 0 15px;position:relative;font-size:16px}
.av{width:52px;height:52px;border-radius:50%;margin-right:18px;flex:none}
.av.d{background:#c4cdd8;overflow:hidden;position:relative}
.av.d:before{content:"";position:absolute;left:14px;top:7px;width:16px;height:17px;border-radius:50%;background:#e8edf3}
.av.d:after{content:"";position:absolute;left:7px;top:26px;width:30px;height:24px;border-radius:50%;background:#e8edf3}
.ph{margin-left:auto;font-size:20px;color:#444}
.tab{position:absolute;bottom:18px;left:14px;right:14px;height:54px;border-radius:27px;background:rgba(250,250,250,.96);box-shadow:0 2px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:space-around;font-size:8px;text-align:center}

/* call */
#call,#talk{background:linear-gradient(#6f7073 0,#6a6b6d 35%,#5e5f55 62%,#8a8a28 72%,#6b6b60 82%,#6f7073);color:#fff}
.pill{position:absolute;left:38px;top:10px;background:#34c759;border-radius:14px;padding:3px 13px;font-size:15px;font-weight:600}
#call .sb .t,#talk .sb .t{display:none}
.big{position:absolute;top:150px;left:50%;margin-left:-89px;width:178px;height:178px;border-radius:50%;background:#c4cdd8;overflow:hidden}
.big:before{content:"";position:absolute;left:55px;top:28px;width:68px;height:72px;border-radius:50%;background:#e8edf3}
.big:after{content:"";position:absolute;left:26px;top:106px;width:126px;height:100px;border-radius:50%;background:#e8edf3}
.nm{position:absolute;top:337px;left:0;right:0;text-align:center;font-size:26px;font-weight:400;color:#fff;letter-spacing:.04em}
.dots{position:absolute;top:390px;width:100%;text-align:center;font-size:16px;letter-spacing:3px;color:#9be39b}
.btm{position:absolute;bottom:0;left:0;right:0;height:170px}
.red{position:absolute;left:50%;margin-left:-35px;bottom:98px;width:70px;height:70px;border-radius:50%;background:#e8334a;font-size:34px;line-height:68px;text-align:center}
.sm{position:absolute;bottom:98px;font-size:9px;text-align:center;width:90px}.sm b{display:block;font-size:28px;font-weight:400;margin-bottom:4px}
